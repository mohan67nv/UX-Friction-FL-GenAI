  <text x="154" y="404" text-anchor="middle" fill="#34D399" font-size="11">100% traffic — not just 30%</text>
  <rect x="54" y="420" width="200" height="24" rx="12" fill="#3ECF8E" opacity="0.12"/>
  <text x="154" y="436" text-anchor="middle" fill="#6EE7B7" font-size="11">No consent needed. Ever.</text>

