  <text x="1034" y="346" text-anchor="middle" fill="#6EE7B7" font-size="12">Not just data — AI tells</text>
  <text x="1034" y="366" text-anchor="middle" fill="#6EE7B7" font-size="12">you WHY users are leaving</text>
  <rect x="924" y="388" width="220" height="24" rx="12" fill="#3ECF8E" opacity="0.18"/>
  <text x="1034" y="404" text-anchor="middle" fill="#34D399" font-size="11">"Safari CSS bug — fix in 15 min"</text>
  <rect x="924" y="420" width="220" height="24" rx="12" fill="#3ECF8E" opacity="0.12"/>
  <text x="1034" y="436" text-anchor="middle" fill="#6EE7B7" font-size="11">Revenue impact calculated</text>

  <!-- ── FOOTER ── -->
  <text x="600" y="506" text-anchor="middle" fill="#334155" font-size="11" letter-spacing="2">PRIVALYTICS · ZEROBANNER</text>
  <text x="600" y="526" text-anchor="middle" fill="#2d3748" font-size="11">TDDDG §25 Exempt  ·  GDPR Compliant  ·  No Consent Needed  ·  Hetzner Frankfurt 🇩🇪</text>

</svg>
