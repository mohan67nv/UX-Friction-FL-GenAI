       CARD 2 — ON-DEVICE AI
  ══════════════════════════ -->
  <rect x="320" y="148" width="248" height="40" rx="8" fill="url(#glow2)"/>
  <rect x="320" y="172" width="248" height="300" rx="18" fill="url(#card2)" stroke="#3ECF8E" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="342" y="190" width="36" height="22" rx="11" fill="#3ECF8E" opacity="0.35"/>
  <text x="360" y="205" text-anchor="middle" fill="#D1FAE5" font-size="11" font-weight="700">02</text>
  <text x="444" y="268" text-anchor="middle" font-size="48">🔒</text>
  <text x="444" y="304" text-anchor="middle" fill="#F3F4F6" font-size="16" font-weight="700">AI Runs in Browser</text>
  <line x1="344" y1="322" x2="544" y2="322" stroke="#3ECF8E" stroke-width="0.5" opacity="0.3"/>
  <text x="444" y="346" text-anchor="middle" fill="#6EE7B7" font-size="12">Detects rage clicks, confusion</text>
  <text x="444" y="366" text-anchor="middle" fill="#6EE7B7" font-size="12">drop-offs — on their device</text>
  <rect x="344" y="388" width="200" height="24" rx="12" fill="#3ECF8E" opacity="0.18"/>
  <text x="444" y="404" text-anchor="middle" fill="#34D399" font-size="11">Raw data never leaves device</text>
  <rect x="344" y="420" width="200" height="24" rx="12" fill="#3ECF8E" opacity="0.12"/>
  <text x="444" y="436" text-anchor="middle" fill="#6EE7B7" font-size="11">Zero PII collected. Ever.</text>

  <!-- ══════════════════════════
       CARD 3 — AGGREGATION
  ══════════════════════════ -->
  <rect x="610" y="148" width="248" height="40" rx="8" fill="url(#glow3)"/>
  <rect x="610" y="172" width="248" height="300" rx="18" fill="url(#card3)" stroke="#3ECF8E" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="632" y="190" width="36" height="22" rx="11" fill="#3ECF8E" opacity="0.35"/>
  <text x="650" y="205" text-anchor="middle" fill="#D1FAE5" font-size="11" font-weight="700">03</text>
  <text x="734" y="268" text-anchor="middle" font-size="48">⚡</text>
  <text x="734" y="304" text-anchor="middle" fill="#F3F4F6" font-size="16" font-weight="700">Patterns Aggregated</text>
  <line x1="634" y1="322" x2="834" y2="322" stroke="#3ECF8E" stroke-width="0.5" opacity="0.3"/>
  <text x="734" y="346" text-anchor="middle" fill="#6EE7B7" font-size="12">Only math sent to server</text>
