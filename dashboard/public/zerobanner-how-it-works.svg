  <rect x="900" y="172" width="268" height="300" rx="18" fill="url(#card4)" stroke="#3ECF8E" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="922" y="190" width="36" height="22" rx="11" fill="#3ECF8E" opacity="0.35"/>
  <text x="940" y="205" text-anchor="middle" fill="#D1FAE5" font-size="11" font-weight="700">04</text>
  <text x="1034" y="268" text-anchor="middle" font-size="48">📊</text>
