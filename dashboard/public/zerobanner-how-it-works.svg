       CARD 1 — USER VISITS
  ══════════════════════════ -->
  <rect x="30"  y="148" width="248" height="40" rx="8" fill="url(#glow1)"/>
  <rect x="30"  y="172" width="248" height="300" rx="18" fill="url(#card1)" stroke="#3ECF8E" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="52"  y="190" width="36" height="22" rx="11" fill="#3ECF8E" opacity="0.35"/>
  <text x="70"  y="205" text-anchor="middle" fill="#D1FAE5" font-size="11" font-weight="700">01</text>
  <text x="154" y="268" text-anchor="middle" font-size="48">🌐</text>
  <text x="154" y="304" text-anchor="middle" fill="#F3F4F6" font-size="16" font-weight="700">User Visits Your Site</text>
  <line x1="54" y1="322" x2="254" y2="322" stroke="#3ECF8E" stroke-width="0.5" opacity="0.3"/>
  <text x="154" y="346" text-anchor="middle" fill="#6EE7B7" font-size="12">No cookie banner appears</text>
