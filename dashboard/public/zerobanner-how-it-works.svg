  <text x="734" y="404" text-anchor="middle" fill="#34D399" font-size="11">Hetzner Frankfurt 🇩🇪 — GDPR safe</text>
  <rect x="634" y="420" width="200" height="24" rx="12" fill="#3ECF8E" opacity="0.12"/>
  <text x="734" y="436" text-anchor="middle" fill="#6EE7B7" font-size="11">Differential privacy applied</text>

