  <line x1="268" y1="355" x2="310" y2="355" stroke="#3ECF8E" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="558" y1="355" x2="600" y2="355" stroke="#3ECF8E" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="848" y1="355" x2="890" y2="355" stroke="#3ECF8E" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7" marker-end="url(#arr)"/>

