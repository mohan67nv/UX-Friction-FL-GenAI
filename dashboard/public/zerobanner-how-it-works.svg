  <text x="600" y="41" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2">HOW ZEROBANNER WORKS</text>

  <text x="600" y="90" text-anchor="middle" fill="#fff"     font-size="32" font-weight="700">See Every User. Track Nobody.</text>
  <text x="600" y="118" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">The world's first UX analytics tool that needs zero cookie consent.</text>

