  <circle cx="240" cy="30"  r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="950" cy="50"  r="1"   fill="#fff" opacity="0.2"/>
  <circle cx="1120" cy="120" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="600" cy="20"  r="1"   fill="#fff" opacity="0.2"/>
  <circle cx="1050" cy="500" r="1"  fill="#fff" opacity="0.2"/>
  <circle cx="100" cy="500" r="1.5" fill="#fff" opacity="0.15"/>

