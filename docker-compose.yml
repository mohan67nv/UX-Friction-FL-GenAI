services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: privacyedge
      POSTGRES_PASSWORD: privacyedge
      POSTGRES_DB: privacyedge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://privacyedge:privacyedge@postgres:5432/privacyedge
      REDIS_URL: redis://redis:6379/0
      API_KEY_SALT: change-me
      CORS_ORIGINS: http://localhost:3000
      # GenAI / semantic retrieval (optional)
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_BACKEND: hash
      LLM_BACKEND: auto
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  dashboard:
    build:
      context: ./dashboard
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: dev-key-change-me
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
